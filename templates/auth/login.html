{% extends 'base.html' %}

{% block title %}Sign In | DermaCare AI{% endblock %}

{% block content %}
<section class="section" style="padding-top: 4rem; padding-bottom: 4rem;">
  <div class="container container-narrow">
    <div class="card" style="max-width: 460px; margin: 0 auto; padding: 2.5rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="nav-logo-icon" style="width: 48px; height: 48px; margin: 0 auto 1rem; border-radius: var(--radius-sm);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 0 0-10 10c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
          </svg>
        </div>
        <h1 class="heading-serif" style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h1>
        <p style="color: var(--color-text-muted); font-size: 0.95rem;">
          Sign in to access your screening history and reports
        </p>
      </div>

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="name@example.com" 
            value="{{ email or '' }}" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="login_password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="login_password" 
              name="password" 
              class="form-control" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" data-target="login_password" aria-label="Toggle password view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--color-border); font-size: 0.9rem;">
        <span style="color: var(--color-text-muted);">Don't have an account yet?</span>
        <a href="{{ url_for('auth.register') }}" style="font-weight: 600; margin-left: 0.25rem;">Create Account</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
