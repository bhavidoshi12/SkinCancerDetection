{% extends 'base.html' %}

{% block title %}Page Not Found (404) | DermaCare AI{% endblock %}

{% block content %}
<section class="section" style="padding-top: 5rem; padding-bottom: 5rem; text-align: center;">
  <div class="container container-narrow">
    <div class="card" style="padding: 3rem 2rem; max-width: 500px; margin: 0 auto;">
      <span class="badge badge-warning" style="margin-bottom: 1rem;">Error 404</span>
      <h1 class="heading-serif" style="font-size: 2.2rem; margin-bottom: 0.75rem;">Page Not Found</h1>
      <p style="color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 1.75rem;">
        The requested URL was not found on this screening server. The page may have been moved or does not exist.
      </p>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Homepage</a>
    </div>
  </div>
</section>
{% endblock %}
